<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Lumo — Films, séries &amp; animes</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e50914'/%3E%3Cpath d='M10 8l12 8-12 8z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="#/">
      <span class="logo-play">▶</span> Lumo
    </a>
    <button id="btn-menu-toggle" class="icon-btn menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="header-menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <form id="search-form" class="search-bar" role="search">
      <input id="search-input" type="search" placeholder="Rechercher un film, une série, un anime..." autocomplete="off" aria-label="Rechercher" />
      <button type="submit" class="search-btn" aria-label="Rechercher">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </form>
    <div id="header-menu" class="header-menu">
      <nav class="nav-links">
        <a href="#/" class="nav-link">Accueil</a>
      </nav>
      <div class="header-actions">
        <button id="btn-settings" class="icon-btn" title="Paramètres" aria-label="Paramètres">⚙</button>
        <span id="account-area"></span>
      </div>
    </div>
  </header>

  <main id="app" class="app"></main>

  <div id="modal-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
