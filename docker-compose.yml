services:
  lumo:
    build: .
    container_name: lumo
    restart: unless-stopped
    ports:
      # 7781 (public) -> 3002 (interne)
      - "7781:3002"
    env_file:
      - ./server/.env
    environment:
      - PORT=3002
    volumes:
      # Persiste les comptes et la clé JWT générée
      - lumo_data:/app/server/data
      # Dossier de téléchargements des vidéos (lecture locale)
      - lumo_downloads:/app/downloads

volumes:
  lumo_data:
  lumo_downloads:
